version: "3.9"

services:
  postgresql:
    image: postgres:15
    container_name: "gsp_postgresql"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=open
      - POSTGRES_USER=postgres
      - POSTGRES_DB=GeoSensePlus
      - POSTGRES_PORT=5432
      # - PGDATA="/data/postgres"  # PGDATA: /data/postgres

    #volumes:
      #- postgresql-data-15:/var/lib/postgresql/data
    networks:
      - geosenseplusnetwork
    # restart: unless-stopped

networks:
  geosenseplusnetwork:

