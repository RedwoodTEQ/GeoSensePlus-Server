# backup existing data:
# docker exec gsp_postgresql pg_dumpall -U postgres > backup.sql
#
# restore from backup:
# docker exec -i gsp_postgresql psql -U postgres < backup.sql


services:
  postgresql:
    image: postgres:17.6
    container_name: "gsp_postgresql"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=open
      - POSTGRES_USER=postgres
      - POSTGRES_DB=GeoSensePlus
      - POSTGRES_PORT=5432
      # - PGDATA="/data/postgres"  # PGDATA: /data/postgres

    #volumes:
      #- postgresql-data-17:/var/lib/postgresql/data
    networks:
      - geosenseplusnetwork
    # restart: unless-stopped

networks:
  geosenseplusnetwork:

